<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2EFE8" />
    <script>
      // Resolve the palette before React and the stylesheet paint the page.
      (() => {
        let saved
        try { saved = localStorage.getItem('warren:theme') } catch {}
        const theme = saved === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#151614' : '#f2efe8'
      })()
    </script>
    <meta name="description" content="Warren A. Panergayo — Web & Mobile Developer in San Pablo City, Philippines. Selected projects, development stack, and a little context." />
    <meta property="og:title" content="Warren Panergayo — Web & Mobile Developer" />
    <meta property="og:description" content="Web. Mobile. Built with intent. Explore Warren's selected work, stack, and story." />
    <meta property="og:type" content="website" />
    <title>Warren Panergayo — Web & Mobile Developer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
